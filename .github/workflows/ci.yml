# Integración continua: en cada push a main se entrena, se prueba, se escanea la
# imagen y, solo si todo pasa, se publica en GitHub Container Registry (GHCR).
name: ci
on:
  push:
    branches: [main]

jobs:
  probar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # permiso para publicar la imagen en GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python modelo/entrenar.py
      - run: pytest -q # si una prueba falla, el flujo se detiene aquí
      - run: docker build -t clasificaia:ci .
      # Hito 4: falla si la imagen tiene vulnerabilidades críticas
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: clasificaia:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
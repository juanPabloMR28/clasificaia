<!doctype html>
<!-- Página del clasificador SVM (make_moons): formulario + gráfica de puntos. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVM · Patrones no lineales</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-bottom: 0.6rem; }
    input { width: 100%; padding: 4px; box-sizing: border-box; }
    button { padding: 6px 14px; }
    canvas { width: 100%; border: 1px solid #ccc; border-radius: 6px; cursor: crosshair; }
    #resultado { font-weight: bold; }
    .nota { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Clasificador SVM</h1>
  <p>Patrones no lineales (make_moons). Escribe un punto (x1, x2) o haz clic en la gráfica
     y el modelo dirá a qué luna pertenece.</p>

  <canvas id="grafica" width="420" height="300"></canvas>
  <p class="nota"><span style="color:#2a6fdb">●</span> luna superior
     <span style="color:#e8830c">●</span> luna inferior
     <span>◎</span> tu punto</p>

  <form id="formulario">
    <!-- name debe coincidir con los campos de la clase Punto en app/main.py -->
    <label>x1
      <input name="x1" type="number" step="0.1" value="0" required></label>
    <label>x2
      <input name="x2" type="number" step="0.1" value="1" required></label>
    <!-- Hito 4: si la API exige llave, se escribe aquí (no se guarda en el código) -->
    <label>Llave de acceso (opcional)
      <input id="llave" type="password" autocomplete="off"></label>
    <button>Clasificar</button>
  </form>
  <p id="resultado"></p>

  <script>
    const COLORES = ["#2a6fdb", "#e8830c"];
    const XMIN = -2, XMAX = 3, YMIN = -1.5, YMAX = 2;   // ventana de la gráfica
    const lienzo = document.getElementById("grafica");
    const g = lienzo.getContext("2d");
    let puntos = [];
    let consulta = null;

    const px = (x) => (x - XMIN) / (XMAX - XMIN) * lienzo.width;
    const py = (y) => lienzo.height - (y - YMIN) / (YMAX - YMIN) * lienzo.height;

    function dibujar() {
      g.clearRect(0, 0, lienzo.width, lienzo.height);
      for (const [x, y, c] of puntos) {
        g.fillStyle = COLORES[c];
        g.beginPath(); g.arc(px(x), py(y), 3, 0, 7); g.fill();
      }
      if (consulta) {
        g.strokeStyle = "#000"; g.lineWidth = 2;
        g.beginPath(); g.arc(px(consulta.x1), py(consulta.x2), 8, 0, 7); g.stroke();
      }
    }

    fetch("/muestra").then(r => r.json()).then(j => { puntos = j.puntos; dibujar(); });

    // Clic en la gráfica: llena el formulario y clasifica
    lienzo.addEventListener("click", (e) => {
      const r = lienzo.getBoundingClientRect();
      const x = XMIN + (e.clientX - r.left) / r.width * (XMAX - XMIN);
      const y = YMAX - (e.clientY - r.top) / r.height * (YMAX - YMIN);
      const f = document.getElementById("formulario");
      f.x1.value = x.toFixed(2); f.x2.value = y.toFixed(2);
      f.requestSubmit();
    });

    document.getElementById("formulario").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const campos = new FormData(evento.target);
      const datos = {};
      for (const [nombre, valor] of campos) datos[nombre] = parseFloat(valor);

      const cabeceras = { "Content-Type": "application/json" };
      const llave = document.getElementById("llave").value;
      if (llave) cabeceras["x-api-key"] = llave;

      const resp = await fetch("/predict", {
        method: "POST", headers: cabeceras, body: JSON.stringify(datos),
      });
      const json = await resp.json();
      consulta = resp.ok ? datos : null;
      dibujar();
      document.getElementById("resultado").textContent = resp.ok
        ? `${json.clase} (confianza ${json.confianza})`
        : "Datos inválidos: revisa los valores";
    });
  </script>
</body>
</html>
